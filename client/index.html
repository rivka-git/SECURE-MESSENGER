<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Messenger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #111b21;
    color: #e9edef;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── LOGIN SCREEN ─── */
  #login-screen {
    background: #202c33;
    border-radius: 16px;
    padding: 48px 40px;
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 8px 32px #0006;
  }
  #login-screen h1 {
    text-align: center;
    font-size: 22px;
    color: #00a884;
    margin-bottom: 8px;
  }
  #login-screen p {
    text-align: center;
    font-size: 13px;
    color: #8696a0;
    margin-top: -8px;
    margin-bottom: 8px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .input-group label { font-size: 12px; color: #8696a0; }
  .input-group input {
    background: #2a3942;
    border: 1px solid #3b4a54;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e9edef;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .input-group input:focus { border-color: #00a884; }

  .btn-primary {
    background: #00a884;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: #017561; }

  .toggle-link {
    text-align: center;
    font-size: 13px;
    color: #8696a0;
  }
  .toggle-link span {
    color: #00a884;
    cursor: pointer;
    font-weight: 600;
  }
  .toggle-link span:hover { text-decoration: underline; }

  #login-error {
    color: #f15c6d;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }

  /* ─── CHAT SCREEN ─── */
  #chat-screen {
    display: none;
    width: 100vw;
    height: 100vh;
    flex-direction: row;
  }

  /* sidebar */
  #sidebar {
    width: 360px;
    background: #202c33;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #2a3942;
    flex-shrink: 0;
  }
  #sidebar-header {
    background: #202c33;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #2a3942;
  }
  #my-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #00a884;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
    flex-shrink: 0;
  }
  #my-username { font-size: 15px; font-weight: 600; flex: 1; }
  #logout-btn {
    background: none; border: none; color: #8696a0;
    cursor: pointer; font-size: 20px; padding: 4px;
  }
  #logout-btn:hover { color: #e9edef; }

  #search-box {
    padding: 8px 12px;
    background: #111b21;
  }
  #search-box input {
    width: 100%;
    background: #202c33;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    color: #e9edef;
    font-size: 14px;
    outline: none;
  }

  #contacts-list {
    flex: 1;
    overflow-y: auto;
  }
  #contacts-list::-webkit-scrollbar { width: 6px; }
  #contacts-list::-webkit-scrollbar-thumb { background: #3b4a54; border-radius: 3px; }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid #2a3942;
    transition: background .15s;
  }
  .contact-item:hover { background: #2a3942; }
  .contact-item.active { background: #2a3942; }

  .contact-avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #3b4a54;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #aebac1;
    flex-shrink: 0;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 15px; font-weight: 500; }
  .contact-preview {
    font-size: 13px; color: #8696a0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .contact-time { font-size: 11px; color: #8696a0; }

  #new-chat-btn {
    margin: 12px;
    background: #00a884;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #new-chat-btn:hover { background: #017561; }

  /* main chat area */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0b141a;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #8696a0;
    gap: 12px;
  }
  #empty-state .icon { font-size: 64px; opacity: .3; }
  #empty-state p { font-size: 15px; }

  #chat-header {
    display: none;
    background: #202c33;
    padding: 10px 16px;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #2a3942;
  }
  #chat-header-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #3b4a54;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #aebac1;
  }
  #chat-header-name { font-size: 16px; font-weight: 600; flex: 1; }
  #chat-header-status { font-size: 12px; color: #00a884; }

  #messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #messages-container::-webkit-scrollbar { width: 6px; }
  #messages-container::-webkit-scrollbar-thumb { background: #3b4a54; border-radius: 3px; }

  .msg-bubble {
    max-width: 65%;
    padding: 8px 12px 6px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    position: relative;
    word-break: break-word;
  }
  .msg-bubble.sent {
    background: #005c4b;
    align-self: flex-end;
    border-bottom-left-radius: 2px;
  }
  .msg-bubble.received {
    background: #202c33;
    align-self: flex-start;
    border-bottom-right-radius: 2px;
  }
  .msg-time {
    font-size: 11px;
    color: #8696a0;
    text-align: left;
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }
  .msg-bubble.sent .msg-time { justify-content: flex-end; }
  .read-tick { color: #53bdeb; font-size: 13px; }
  .unread-tick { color: #8696a0; font-size: 13px; }
  .msg-failed-label { font-size: 11px; color: #f15c6d; margin-top: 3px; text-align: right; cursor: pointer; }
  .msg-failed-label:hover { text-decoration: underline; }

  .date-divider {
    text-align: center;
    margin: 12px 0;
  }
  .date-divider span {
    background: #182229;
    color: #8696a0;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 8px;
  }

  #input-area {
    display: none;
    background: #202c33;
    padding: 10px 16px;
    gap: 10px;
    align-items: flex-end;
    border-top: 1px solid #2a3942;
  }
  #message-input {
    flex: 1;
    background: #2a3942;
    border: none;
    border-radius: 24px;
    padding: 10px 18px;
    color: #e9edef;
    font-size: 15px;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
  }
  #emotion-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #654321;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .2s;
    title: "הוסף אימוגי לפי פנים";
  }
  #emotion-btn:hover { background: #8b5a3c; }
  #emotion-btn.detecting { background: #d4af37; }
  #selected-emoji {
    font-size: 24px;
    min-width: 44px;
    text-align: center;
    opacity: 0;
    transition: opacity .2s;
  }
  #selected-emoji.active { opacity: 1; }

  #camera-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #camera-modal {
    background: #202c33;
    border-radius: 16px;
    padding: 16px;
    width: min(92vw, 420px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }
  #camera-modal video {
    width: 100%;
    border-radius: 14px;
    background: #000;
  }
  #camera-emoji-overlay {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 64px;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(0,0,0,0.7);
    opacity: 0.9;
  }
  #camera-modal p {
    color: #e9edef;
    font-size: 14px;
    text-align: center;
    line-height: 1.4;
  }
  .camera-modal-btns {
    display: flex;
    gap: 10px;
  }
  .camera-modal-btns button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  #camera-capture-btn { background: #00a884; color: #fff; }
  #camera-close-btn { background: #2a3942; color: #e9edef; }
  #camera-status { color: #8696a0; font-size: 13px; text-align: center; min-height: 20px; }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #00a884;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .2s;
  }
  #send-btn:hover { background: #017561; }

  /* new chat modal */
  #modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: #0008;
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal {
    background: #202c33;
    border-radius: 12px;
    padding: 28px 24px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #modal h3 { font-size: 16px; color: #e9edef; }
  #modal input {
    background: #2a3942;
    border: 1px solid #3b4a54;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e9edef;
    font-size: 14px;
    outline: none;
  }
  #modal input:focus { border-color: #00a884; }
  #modal-error { color: #f15c6d; font-size: 13px; min-height: 16px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 10px; border-radius: 8px;
    border: none; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  #modal-cancel { background: #2a3942; color: #e9edef; }
  #modal-confirm { background: #00a884; color: #fff; }
  #modal-confirm:hover { background: #017561; }

  /* group modal */
  #group-modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: #0008;
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #group-modal {
    background: #202c33;
    border-radius: 12px;
    padding: 28px 24px;
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #group-modal h3 { font-size: 16px; color: #e9edef; }
  #group-modal input {
    background: #2a3942;
    border: 1px solid #3b4a54;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e9edef;
    font-size: 14px;
    outline: none;
    width: 100%;
  }
  #group-modal input:focus { border-color: #00a884; }
  #group-members-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 32px;
  }
  .member-tag {
    background: #3b4a54;
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .member-tag span { cursor: pointer; color: #8696a0; font-size: 15px; }
  .member-tag span:hover { color: #f15c6d; }
  #group-modal-error { color: #f15c6d; font-size: 13px; min-height: 16px; }

  /* group avatar */
  .contact-avatar.group-avatar { background: #7b5ea7; font-size: 20px; }

  /* read-by tooltip */
  .msg-read-by {
    font-size: 11px;
    color: #8696a0;
    margin-top: 2px;
    text-align: right;
    cursor: pointer;
  }
  .msg-read-by:hover { color: #53bdeb; }

  /* sidebar buttons row */
  .sidebar-btns {
    display: flex;
    gap: 8px;
    margin: 12px;
  }
  .sidebar-btns button {
    flex: 1;
    background: #00a884;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  .sidebar-btns button:hover { background: #017561; }

  /* group header members */
  #chat-header-members { font-size: 12px; color: #8696a0; }
  .msg-sender-name { font-size: 11px; color: #00a884; margin-bottom: 2px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <h1>💬 Secure Messenger</h1>
  <p>הצ'אט המוצפן שלך</p>
  <div class="input-group">
    <label>שם משתמש</label>
    <input id="login-username" type="text" placeholder="alice" autocomplete="off" />
  </div>
  <div class="input-group">
    <label>סיסמה</label>
    <input id="login-password" type="password" placeholder="••••••••" />
  </div>
  <div id="login-error"></div>
  <button class="btn-primary" id="login-btn">התחברות</button>
  <div class="toggle-link">אין לך חשבון? <span id="go-register">הירשם</span></div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="my-avatar"></div>
      <span id="my-username"></span>
      <button id="logout-btn" title="התנתק">⏻</button>
    </div>
    <div id="search-box">
      <input type="text" placeholder="🔍  חיפוש שיחה..." id="search-input" />
    </div>
    <div id="contacts-list"></div>
    <div class="sidebar-btns">
      <button id="new-chat-btn">+ שיחה חדשה</button>
      <button id="new-group-btn">👥 קבוצה חדשה</button>
    </div>
  </div>

  <div id="chat-area">
    <div id="chat-header">
      <div id="chat-header-avatar"></div>
      <div style="flex:1">
        <div id="chat-header-name"></div>
        <div id="chat-header-members"></div>
      </div>
    </div>
    <div id="empty-state">
      <div class="icon">💬</div>
      <p>בחר שיחה כדי להתחיל</p>
    </div>
    <div id="messages-container" style="display:none"></div>
    <div id="input-area">
      <textarea id="message-input" rows="1" placeholder="הקלד הודעה... או שלח אימוג'י" ></textarea>
      <button id="emotion-btn" title="הוסף אימוגי לפי פנים">🎭</button>
      <div id="selected-emoji"></div>
      <button id="send-btn">➤</button>
    </div>
  </div>
</div>

<div id="camera-modal-overlay">
  <div id="camera-modal">
    <div id="camera-emoji-overlay"></div>
    <video id="camera-video" autoplay muted playsinline></video>
    <p>המצלמה פועלת בזמן זיהוי הרגש. לחץ על "זהה רגש" כדי לשלוח את התמונה לשרת.</p>
    <div id="camera-status"></div>
    <div class="camera-modal-btns">
      <button id="camera-capture-btn">זהה רגש</button>
      <button id="camera-close-btn">סגור</button>
    </div>
  </div>
</div>

<!-- NEW CHAT MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h3>שיחה חדשה</h3>
    <input id="modal-recipient" type="text" placeholder="שם משתמש של הנמען" />
    <div id="modal-error"></div>
    <div class="modal-btns">
      <button id="modal-cancel">ביטול</button>
      <button id="modal-confirm">פתח שיחה</button>
    </div>
  </div>
</div>

<!-- GROUP MODAL -->
<div id="group-modal-overlay">
  <div id="group-modal">
    <h3>👥 קבוצה חדשה</h3>
    <input id="group-name-input" type="text" placeholder="שם הקבוצה" />
    <div style="display:flex;gap:8px">
      <input id="group-member-input" type="text" placeholder="הוסף משתמש" style="flex:1" />
      <button onclick="addGroupMember()" style="background:#00a884;color:#fff;border:none;border-radius:8px;padding:0 14px;cursor:pointer;font-size:18px">+</button>
    </div>
    <div id="group-members-list"></div>
    <div id="group-modal-error"></div>
    <div class="modal-btns">
      <button id="group-modal-cancel">ביטול</button>
      <button id="group-modal-confirm">צור קבוצה</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8080';
let token = null;
let currentUser = null;
let currentChat = null;
let eventSource = null;
let selectedEmoji = null;  // Store detected emoji
let cameraStream = null;
// { username: [{ id, sender, recipient, content, emoji, created_at }] }
const conversations = {};

// ─── UTILS ───
const $ = id => document.getElementById(id);
const avatar = name => name ? name[0].toUpperCase() : '?';
const fmtTime = iso => new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
const fmtDate = iso => new Date(iso).toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });

// ─── AUTH ───
$('go-register').onclick = () => {
  const isRegister = $('login-btn').textContent === 'הרשמה';
  $('login-btn').textContent = isRegister ? 'התחברות' : 'הרשמה';
  $('go-register').textContent = isRegister ? 'הירשם' : 'יש לך חשבון? התחבר';
  $('login-error').textContent = '';
};

$('login-btn').onclick = async () => {
  const username = $('login-username').value.trim();
  const password = $('login-password').value.trim();
  if (!username || !password) return;

  const isRegister = $('login-btn').textContent === 'הרשמה';

  if (isRegister) {
    const r = await fetch(`${API}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      $('login-error').textContent = (await r.json()).detail || 'שגיאה בהרשמה';
      return;
    }
  }

  const r = await fetch(`${API}/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  if (!r.ok) {
    $('login-error').textContent = 'שם משתמש או סיסמה שגויים';
    return;
  }
  const data = await r.json();
  token = data.access_token;
  currentUser = username;
  enterChat();
};

$('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('login-btn').click();
});

// ─── ENTER CHAT ───
async function enterChat() {
  $('login-screen').style.display = 'none';
  $('chat-screen').style.display = 'flex';
  $('my-username').textContent = currentUser;
  $('my-avatar').textContent = avatar(currentUser);

  await loadHistory();
  startSSE();
}

async function loadHistory() {
  const r = await fetch(`${API}/messages`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!r.ok) return;
  const msgs = await r.json();
  msgs.forEach(addMessage);
  renderContacts();
}

// ─── SSE with auth header via fetch+ReadableStream ───
// EventSource doesn't support headers, so we use fetch for SSE
async function startSSE() {
  try {
    const response = await fetch(`${API}/stream`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!response.ok) {
      console.error('SSE failed to connect:', response.status, await response.text());
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) {
        console.warn('SSE stream closed by server');
        break;
      }
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data:')) {
          const raw = line.slice(5).trim();
          try {
            const msg = JSON.parse(raw);
            if (msg.type === 'read') {
              const other = msg.sender === currentUser ? msg.recipient : msg.sender;
              const conv = conversations[other] || [];
              conv.forEach(m => { if (m.id === msg.message_id) m.is_read = true; });
              if (currentChat === other) renderMessages(currentChat);
              continue;
            }
            if (msg.sender === currentUser) continue;
            addMessage(msg);
            renderContacts();
            if (currentChat === msg.sender && msg.recipient === currentUser && document.visibilityState === 'visible') {
              fetch(`${API}/messages/${msg.id}/read`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
              msg.is_read = true;
            }
            if (currentChat === msg.sender || currentChat === msg.recipient) {
              renderMessages(currentChat);
            }
          } catch (err) {
            console.error('SSE data parse failed:', err, raw);
          }
        }
      }
    }
  } catch (err) {
    console.error('SSE connection failed:', err);
  } finally {
    setTimeout(() => {
      if (currentUser) startSSE();
    }, 3000);
  }
}

// ─── MESSAGES ───
function addMessage(msg) {
  const other = msg.sender === currentUser ? msg.recipient : msg.sender;
  if (!conversations[other]) conversations[other] = [];
  // avoid duplicates
  if (!conversations[other].find(m => m.id === msg.id)) {
    conversations[other].push(msg);
    conversations[other].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  }
}

// ─── CONTACTS SIDEBAR ───
function renderContacts() {
  const search = $('search-input').value.toLowerCase();
  const list = $('contacts-list');
  list.innerHTML = '';

  const sorted = Object.entries(conversations)
    .filter(([name]) => name.toLowerCase().includes(search))
    .sort(([, a], [, b]) => {
      const la = a[a.length - 1]?.created_at || '';
      const lb = b[b.length - 1]?.created_at || '';
      return lb.localeCompare(la);
    });

  for (const [name, msgs] of sorted) {
    const last = msgs[msgs.length - 1];
    const div = document.createElement('div');
    div.className = 'contact-item' + (name === currentChat ? ' active' : '');
    div.innerHTML = `
      <div class="contact-avatar">${avatar(name)}</div>
      <div class="contact-info">
        <div class="contact-name">${name}</div>
        <div class="contact-preview">${last ? (last.sender === currentUser ? '✓ ' : '') + last.content : ''}</div>
      </div>
      <div class="contact-time">${last ? fmtTime(last.created_at) : ''}</div>
    `;
    div.onclick = () => openChat(name);
    list.appendChild(div);
  }
}

$('search-input').oninput = renderContacts;

// ─── OPEN CHAT ───
function openChat(name) {
  currentChat = name;
  $('empty-state').style.display = 'none';
  $('messages-container').style.display = 'flex';
  $('chat-header').style.display = 'flex';
  $('input-area').style.display = 'flex';
  $('chat-header-avatar').textContent = avatar(name);
  $('chat-header-name').textContent = name;
  if (!conversations[name]) conversations[name] = [];
  (conversations[name] || []).forEach(m => {
    if (m.recipient === currentUser && !m.is_read && m.id && !String(m.id).startsWith('tmp_') && document.visibilityState === 'visible') {
      fetch(`${API}/messages/${m.id}/read`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      m.is_read = true;
    }
  });
  renderMessages(name);
  renderContacts();
}

// ─── RENDER MESSAGES ───
function renderMessages(name) {
  const container = $('messages-container');
  container.innerHTML = '';
  const msgs = conversations[name] || [];
  let lastDate = '';

  for (const msg of msgs) {
    const dateStr = fmtDate(msg.created_at);
    if (dateStr !== lastDate) {
      lastDate = dateStr;
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.innerHTML = `<span>${dateStr}</span>`;
      container.appendChild(div);
    }

    const isSent = msg.sender === currentUser;
    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${isSent ? 'sent' : 'received'}${msg._failed ? ' failed' : ''}`;
    let tick = '';
    if (isSent && !msg._pending && !msg._failed) {
      tick = msg.is_read
        ? `<span class="read-tick">✓✓</span>`
        : `<span class="unread-tick">✓✓</span>`;
    }
    let extra = '';
    if (msg._failed) extra = `<div class="msg-failed-label" onclick="retrySend('${msg.id}', '${escapeHtml(msg.content)}')">❌ לא נשלחה — לחץ לנסות שוב</div>`;
    const emojiDisplay = msg.emoji ? `<div style="font-size: 28px; margin: 4px 0;">${msg.emoji}</div>` : '';
    bubble.innerHTML = `
      ${emojiDisplay}
      <div>${escapeHtml(msg.content)}</div>
      <div class="msg-time">${fmtTime(msg.created_at)}${tick}</div>
      ${extra}
    `;
    container.appendChild(bubble);
  }
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── SEND MESSAGE ───
async function sendMessage() {
  const input = $('message-input');
  const content = input.value.trim();
  if (!currentChat) return;
  if (!content && !selectedEmoji) return;
  input.value = '';
  input.style.height = 'auto';

  // Store emoji before clearing
  const emoji = selectedEmoji;
  selectedEmoji = null;
  $('selected-emoji').textContent = '';
  $('selected-emoji').classList.remove('active');

  // Add a temporary pending bubble
  const tempId = 'tmp_' + Date.now();
  const tempMsg = { id: tempId, sender: currentUser, recipient: currentChat, content, emoji: emoji, created_at: new Date().toISOString(), _pending: true };
  addMessage(tempMsg);
  renderMessages(currentChat);
  renderContacts();

  try {
    const r = await fetch(`${API}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ content, recipient: currentChat, emoji: emoji }),
    });
    // Remove temp message
    const conv = conversations[currentChat];
    const idx = conv.findIndex(m => m.id === tempId);
    if (r.ok) {
      const msg = await r.json();
      if (idx !== -1) conv.splice(idx, 1, msg);
      else addMessage(msg);
    } else {
      if (idx !== -1) conv[idx]._failed = true;
    }
  } catch {
    const conv = conversations[currentChat];
    const idx = conv.findIndex(m => m.id === tempId);
    if (idx !== -1) conv[idx]._failed = true;
  }
  renderMessages(currentChat);
  renderContacts();
}

function retrySend(tempId, content) {
  const conv = conversations[currentChat];
  const idx = conv.findIndex(m => m.id === tempId);
  if (idx !== -1) conv.splice(idx, 1);
  renderMessages(currentChat);
  $('message-input').value = content;
  sendMessage();
}

// ─── EMOTION DETECTION ───
async function openCameraPreview() {
  const overlay = $('camera-modal-overlay');
  const video = $('camera-video');
  const status = $('camera-status');

  if (cameraStream) {
    overlay.style.display = 'flex';
    $('camera-emoji-overlay').textContent = selectedEmoji || '';
    status.textContent = 'המצלמה פעילה. לחץ על "זהה רגש" כדי לשלוח.';
    return;
  }

  status.textContent = 'פותח מצלמה...';
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = cameraStream;
    await video.play();
    overlay.style.display = 'flex';
    status.textContent = 'המצלמה פעילה. לחץ על "זהה רגש" כדי לשלוח.';
  } catch (err) {
    console.error('Camera open error:', err);
    status.textContent = 'לא ניתן לגשת למצלמה. בדוק הרשאות.';
    cameraStream = null;
    throw err;
  }
}

function closeCameraPreview() {
  const overlay = $('camera-modal-overlay');
  const video = $('camera-video');
  overlay.style.display = 'none';
  $('camera-emoji-overlay').textContent = '';
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
  video.srcObject = null;
}

async function captureEmotionFromCamera() {
  const status = $('camera-status');
  const btn = $('camera-capture-btn');

  if (!cameraStream) {
    status.textContent = 'המצלמה לא פתוחה.';
    return;
  }

  if (btn.dataset.sendPending === 'true') {
    await sendCapturedEmoji();
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳';
  status.textContent = 'שולח תמונה לניתוח...';

  try {
    const video = $('camera-video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
    const form = new FormData();
    form.append('frame', blob, 'frame.jpg');

    const r = await fetch(`${API}/detect-emotion`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` },
      body: form,
    });

    if (!r.ok) {
      const errorText = await r.text();
      throw new Error(errorText || 'שגיאה בזיהוי הרגש');
    }

    const data = await r.json();
    selectedEmoji = data.emoji;
    $('selected-emoji').textContent = selectedEmoji;
    $('selected-emoji').classList.add('active');
    $('camera-emoji-overlay').textContent = selectedEmoji;
    status.textContent = `נמצא: ${data.emotion}`;
    btn.textContent = 'שלח אימוג׳י';
    btn.dataset.sendPending = 'true';
  } catch (err) {
    console.error('Emotion detection error:', err);
    status.textContent = 'שגיאה בזיהוי הרגש. נסה שוב.';
  } finally {
    btn.disabled = false;
  }
}

async function sendCapturedEmoji() {
  if (!currentChat) {
    $('camera-status').textContent = 'בחר שיחה כדי לשלוח אימוג׳י.';
    return;
  }
  $('camera-capture-btn').disabled = true;
  $('camera-status').textContent = 'שולח אימוג׳י...';
  try {
    await sendMessage();
    closeCameraPreview();
    $('camera-capture-btn').textContent = 'זהה רגש';
    $('camera-capture-btn').dataset.sendPending = 'false';
  } catch (err) {
    console.error('Send captured emoji error:', err);
    $('camera-status').textContent = 'שגיאה בשליחת האימוג׳י.';
  } finally {
    $('camera-capture-btn').disabled = false;
  }
}

async function detectEmotion() {
  try {
    await openCameraPreview();
  } catch {
    alert('לא ניתן לפתוח את המצלמה. בדוק הרשאות ודפדפן.');
  }
}

async function maybeAutoSendEmoji() {
  if (!selectedEmoji || !currentChat) return;
  const maybeMessage = $('message-input').value.trim();
  if (maybeMessage.length === 0) {
    await sendMessage();
  }
}

// ─── MARK AS READ WHEN TAB BECOMES VISIBLE ───
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentChat) {
    (conversations[currentChat] || []).forEach(m => {
      if (m.recipient === currentUser && !m.is_read && m.id && !String(m.id).startsWith('tmp_')) {
        fetch(`${API}/messages/${m.id}/read`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
        m.is_read = true;
      }
    });
    renderMessages(currentChat);
  }
});

$('emotion-btn').onclick = detectEmotion;
$('camera-capture-btn').onclick = captureEmotionFromCamera;
$('camera-close-btn').onclick = closeCameraPreview;
$('send-btn').onclick = sendMessage;
$('message-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
$('message-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ─── NEW CHAT MODAL ───
$('new-chat-btn').onclick = () => {
  $('modal-overlay').style.display = 'flex';
  $('modal-recipient').value = '';
  $('modal-error').textContent = '';
  setTimeout(() => $('modal-recipient').focus(), 50);
};
$('modal-cancel').onclick = () => $('modal-overlay').style.display = 'none';
$('modal-confirm').onclick = () => {
  const name = $('modal-recipient').value.trim();
  if (!name) { $('modal-error').textContent = 'הכנס שם משתמש'; return; }
  if (name === currentUser) { $('modal-error').textContent = 'לא ניתן לשלוח לעצמך'; return; }
  $('modal-overlay').style.display = 'none';
  if (!conversations[name]) conversations[name] = [];
  renderContacts();
  openChat(name);
};
$('modal-recipient').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('modal-confirm').click();
});

// ─── LOGOUT ───
$('logout-btn').onclick = () => {
  token = null; currentUser = null; currentChat = null;
  if (eventSource) { eventSource.close(); eventSource = null; }
  Object.keys(conversations).forEach(k => delete conversations[k]);
  $('chat-screen').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('login-password').value = '';
  $('login-error').textContent = '';
};
</script>
